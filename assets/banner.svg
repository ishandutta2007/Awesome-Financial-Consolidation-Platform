<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Accent Glow Gradient -->
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes barGrow {
        0%, 100% { transform: scaleY(0.95); }
        50% { transform: scaleY(1.05); }
      }

      .animated-glow { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .animated-card { animation: floatCard 5s ease-in-out infinite; }
      .animated-card-delayed { animation: floatCard 6s ease-in-out infinite 1.5s; }
      .animated-line { stroke-dasharray: 20 10; animation: waveFlow 25s linear infinite; }
      .animated-bar { transform-origin: bottom; animation: barGrow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
  </g>

  <!-- Ambient Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="100" r="180" fill="#4F46E5" opacity="0.15" class="animated-glow" />
  <circle cx="1000" cy="300" r="200" fill="#EC4899" opacity="0.12" class="animated-glow" />

  <!-- Animated Dynamic Decorative Graphic Elements (Background Z-index) -->
  <g class="animated-card" opacity="0.65">
    <!-- Flow Node 1: Subsidiary A -->
    <rect x="820" y="60" width="130" height="45" rx="8" fill="url(#card-grad)" stroke="#6366F1" stroke-width="1.5" />
    <text x="885" y="87" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Subsidiary A (USD)</text>
    
    <!-- Flow Node 2: Subsidiary B -->
    <rect x="1000" y="60" width="130" height="45" rx="8" fill="url(#card-grad)" stroke="#8B5CF6" stroke-width="1.5" />
    <text x="1065" y="87" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Subsidiary B (EUR)</text>

    <!-- Elimination Node -->
    <rect x="910" y="150" width="150" height="50" rx="10" fill="url(#card-grad)" stroke="#EC4899" stroke-width="1.5" />
    <text x="985" y="173" fill="#F472B6" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚡ FX &amp; Eliminations</text>
    <text x="985" y="189" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Intercompany Reconcilation</text>

    <!-- Connecting Dynamic Flow Lines -->
    <path d="M 885 105 L 945 150" stroke="#818CF8" stroke-width="2" fill="none" class="animated-line" />
    <path d="M 1065 105 L 1025 150" stroke="#C084FC" stroke-width="2" fill="none" class="animated-line" />
  </g>

  <!-- Animated Financial Chart Visual (Background Right) -->
  <g class="animated-card-delayed" transform="translate(850, 240)" opacity="0.75">
    <rect x="0" y="0" width="280" height="120" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Consolidated Financial Roll-up</text>
    
    <!-- Mini Chart Bars -->
    <rect x="30" y="50" width="24" height="45" rx="4" fill="#6366F1" class="animated-bar" />
    <rect x="70" y="40" width="24" height="55" rx="4" fill="#8B5CF6" class="animated-bar" />
    <rect x="110" y="35" width="24" height="60" rx="4" fill="#EC4899" class="animated-bar" />
    <rect x="150" y="25" width="24" height="70" rx="4" fill="#10B981" class="animated-bar" />
    <path d="M 42 70 L 82 60 L 122 55 L 162 40 L 220 30" stroke="#34D399" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="220" cy="30" r="5" fill="#34D399" />
  </g>

  <!-- FOREGROUND CONTENT: Title, Subtitle, Badges/Pills (Guaranteed Clear & Visible) -->
  <g transform="translate(70, 0)">
    <!-- Category Tag / Badge -->
    <rect x="0" y="65" width="260" height="32" rx="16" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5" />
    <text x="130" y="86" fill="#A5B4FC" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" letter-spacing="1" text-anchor="middle">📊 AWESOME EPM &amp; CPM ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="150" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">Awesome Financial</text>
    <text x="0" y="198" fill="url(#glow-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" letter-spacing="-0.5">Consolidation Platform</text>

    <!-- Subtitle -->
    <text x="0" y="245" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      <tspan x="0" dy="0">Curated list of SaaS platforms &amp; open-source projects for multi-entity consolidation,</tspan>
      <tspan x="0" dy="24">intercompany eliminations, currency translation, and close-to-report workflows.</tspan>
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="145" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="72.5" y="21" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">🌐 Multi-Entity GAAP/IFRS</text>

      <rect x="157" y="0" width="155" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="234.5" y="21" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ Intercompany Matching</text>

      <rect x="324" y="0" width="140" height="34" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="394" y="21" fill="#CBD5E1" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">💱 FX Translation</text>
    </g>
  </g>
</svg>
